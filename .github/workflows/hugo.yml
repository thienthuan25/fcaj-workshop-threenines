name: Deploy Hugo site to gh-pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Workflow cần quyền ghi để push website đã build vào nhánh gh-pages
permissions:
  contents: write

# Không để hai lần cập nhật nhánh gh-pages chạy đồng thời
concurrency:
  group: "gh-pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Hugo site
    runs-on: ubuntu-latest

    steps:
      # Tải mã nguồn Hugo và theme submodule
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      # Cài đặt Hugo Extended
      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.134.3"
          extended: true

      # Build website Hugo thành thư mục public/
      # Thay baseURL nếu repository hoặc GitHub username của bạn thay đổi
      - name: Build Hugo site
        run: hugo --minify --baseURL "https://thienthuan25.github.io/workshop-fcaj-intern/"

      # Đẩy thư mục public lên nhánh gh-pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true